
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Registration Page</title>
</head>
<body>

<h2>Bank Registration Page</h2>

<form action="register" method="post">

<label>Enter Bank Name: </label>
<input type="text" placeholder="Enter Bank Name"
       name="bankname" required>
<br><br>

<label>Enter AccountNo: </label>
<input type="text" placeholder="Enter AccountNo"
       name="accountno" required>
<br><br>

<label>Enter AccountName: </label>
<input type="text" placeholder="Enter AccountName"
       name="accountname" required>
<br><br>

<input type="submit" value="Register">

</form>

</body>
</html>
